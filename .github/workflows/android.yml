name: Android
# Runs only when something the Android build or tests depend on changes. Keep
# the shared paths in sync with ios.yml. merge_group ignores path filters, so a
# merge queue always runs it.
on:
  pull_request:
    branches: [main]
    paths:
      - android/**
      # Shared with iOS
      - src/**
      - common/**
      - example/**
      # The release PR (see ci.yml) only bumps the version in package.json and
      # example/app.json, so neither triggers a native build; dependency
      # changes still reach bun.lock.
      - '!example/app.json'
      - bun.lock
      - react-native.config.js
      - .nvmrc
      - .bun-version
      - bunfig.toml
      - .github/actions/**
      - .github/workflows/android.yml
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: bun run test:android:prepare
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: bun run test:android:unit
      - run: bun run test:android:instrumented:assemble
  instrumented:
    name: Android instrumented tests (API ${{ matrix.api-level }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: bun run test:android:prepare
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          enable-hw-keyboard: true
          script: bun run test:android:instrumented
