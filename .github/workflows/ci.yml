name: CI
# Changes land on main through squash-merged PRs, so CI runs on the PR only;
# re-running it on the merge commit would test the same tree twice.
on:
  pull_request:
    branches: [main]
    # release-please's release PR touches only these files (version bump +
    # changelog). Skipping it avoids a full native rebuild for a version bump,
    # and the run GitHub would otherwise hold for approval because a bot opened
    # the PR. Caveat: a PR that changes nothing but these files skips CI too.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - package.json
      - example/app.json
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun run check
      - run: bun run typecheck
      - run: bun run prepare
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: bun run test:android:prepare
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: bun run test:android:unit
      - run: bun run test:android:instrumented:assemble
  android-instrumented:
    name: Android instrumented tests (API ${{ matrix.api-level }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: bun run test:android:prepare
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          enable-hw-keyboard: true
          script: bun run test:android:instrumented
  build-ios:
    runs-on: macos-latest
    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Cache turborepo for iOS
        uses: actions/cache@v5
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-
      # turbo.json hashes the library's native and JS sources, so an unchanged
      # tree replays the cached build instead of compiling the example again.
      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(bun turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi
      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Prebuild the example for iOS
        if: env.turbo_cache_hit != 1
        run: bun run --cwd example expo prebuild --platform ios
      - name: Build the example for iOS
        run: bun turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"
