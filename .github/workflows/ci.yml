name: CI
# Changes land on main through squash-merged PRs, so CI runs on the PR only;
# re-running it on the merge commit would test the same tree twice.
#
# This workflow runs on every PR and covers the JS side. The native builds live
# in android.yml and ios.yml, which only run when their sources change.
#
# release-please opens its release PR with GITHUB_TOKEN, and GitHub doesn't
# start workflows for events created by that token, so no workflow runs on it.
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun run check
      - run: bun run typecheck
      - run: bun run prepare
