name: iOS
# Runs only when something the iOS build depends on changes. Keep the shared
# paths in sync with android.yml. merge_group ignores path filters, so a merge
# queue always runs it.
on:
  pull_request:
    branches: [main]
    paths:
      - ios/**
      - '*.podspec'
      - turbo.json
      # Shared with Android
      - src/**
      - common/**
      - example/**
      - package.json
      - bun.lock
      - react-native.config.js
      - .nvmrc
      - .bun-version
      - bunfig.toml
      - .github/actions/**
      - .github/workflows/ios.yml
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: iOS build
    runs-on: macos-latest
    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Cache turborepo for iOS
        uses: actions/cache@v5
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-
      # turbo.json hashes the library's native and JS sources, so a later push
      # to the same PR that leaves them untouched replays the cached build.
      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(bun turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi
      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Prebuild the example for iOS
        if: env.turbo_cache_hit != 1
        run: bun run --cwd example expo prebuild --platform ios
      - name: Build the example for iOS
        run: bun turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"
